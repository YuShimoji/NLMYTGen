  <rect x="110" y="650" width="1700" height="86" rx="22" fill="#172f42" stroke="#42647a" stroke-width="2"/><text x="960" y="706" text-anchor="middle" fill="#edf8ff" font-size="35" font-family="Meiryo, sans-serif">被災箇所の補修ではなく、川のネットワークを変える抜本策へ</text>
