  <g fill="#293947"><path d="M190 455h160v155H190zM390 410h190v200H390zM1390 430h160v180h-160zM1585 390h190v220h-190z"/><path d="M230 455v-55h80v55M445 410v-80h78v80M1430 430v-65h80v65M1635 390v-90h90v90"/></g>
