<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#101b28"/>
  <text x="110" y="125" fill="#f5fbff" font-size="64" font-weight="700" font-family="Meiryo, sans-serif">完成ではなく、維持される「分流システム」</text>
  <text x="114" y="180" fill="#7ee0c8" font-size="30" font-family="Meiryo, sans-serif">都市化・地盤沈下・ゼロメートル地帯で、守る対象と条件は変化する</text>
  <g font-family="Meiryo, sans-serif" text-anchor="middle"><rect x="130" y="300" width="380" height="300" rx="28" fill="#163347"/><text x="320" y="375" fill="#8edcff" font-size="30">きっかけ</text><text x="320" y="455" fill="#fff" font-size="48" font-weight="700">1910洪水</text><text x="320" y="525" fill="#d8e8ef" font-size="30">抜本策へ</text><path d="M530 450 H650" stroke="#75c3d7" stroke-width="12"/><rect x="670" y="300" width="580" height="300" rx="28" fill="#12445a"/><text x="960" y="375" fill="#8ee3d1" font-size="30">仕組み</text><text x="960" y="455" fill="#fff" font-size="50" font-weight="700">岩淵で分流</text><text x="960" y="525" fill="#d8f0ed" font-size="30">22 kmの人工河川へ</text><path d="M1270 450 H1390" stroke="#75c3d7" stroke-width="12"/><rect x="1410" y="300" width="380" height="300" rx="28" fill="#3a3442"/><text x="1600" y="375" fill="#efc4ff" font-size="30">現在</text><text x="1600" y="455" fill="#fff" font-size="48" font-weight="700">維持・更新</text><text x="1600" y="525" fill="#eee0f2" font-size="30">限界を管理</text></g>
  <rect x="180" y="620" width="1560" height="130" rx="26" fill="#18313d" stroke="#3e6a75" stroke-width="2"/><text x="960" y="678" text-anchor="middle" fill="#eafffb" font-size="38" font-family="Meiryo, sans-serif">水を止める壁ではない</text><text x="960" y="730" text-anchor="middle" fill="#7ee0c8" font-size="42" font-weight="700" font-family="Meiryo, sans-serif">危険な流れを、受け止められる経路へ配り直す</text>
</svg>
