<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><radialGradient id="bg"><stop stop-color="#31285a"/><stop offset=".55" stop-color="#101631"/><stop offset="1" stop-color="#050817"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="110" y="125" fill="#fff" font-size="64" font-weight="700" font-family="Meiryo, sans-serif">銀河は「異なる過去が重なった地図」</text><text x="114" y="182" fill="#b9b6ff" font-size="30" font-family="Meiryo, sans-serif">天の川銀河の円盤は、およそ10万光年規模</text>
  <g transform="translate(960 450) rotate(-12)"><ellipse rx="650" ry="235" fill="none" stroke="#9c77ff" stroke-width="75" opacity=".18" filter="url(#blur)"/><ellipse rx="610" ry="210" fill="none" stroke="#d0c4ff" stroke-width="18" opacity=".55"/><ellipse rx="420" ry="135" fill="none" stroke="#7b9cff" stroke-width="16" opacity=".45"/><ellipse rx="245" ry="76" fill="none" stroke="#ffc46b" stroke-width="15" opacity=".55"/><circle r="48" fill="#fff1bd"/></g>
  <g font-family="Meiryo, sans-serif"><circle cx="600" cy="475" r="16" fill="#5fd6ff"/><text x="630" y="463" fill="#fff" font-size="28">現在地</text><path d="M620 490Q950 250 1300 405" fill="none" stroke="#5fd6ff" stroke-width="7" stroke-dasharray="18 13"/><rect x="1190" y="250" width="420" height="86" rx="20" fill="#1d2348" stroke="#8da6ff"/><text x="1400" y="306" text-anchor="middle" fill="#fff" font-size="32">届く光は出発時刻が違う</text></g>
  <rect x="230" y="660" width="1460" height="82" rx="24" fill="#161a37"/><text x="960" y="714" text-anchor="middle" fill="#f2f0ff" font-size="34" font-family="Meiryo, sans-serif">一枚の夜空に、秒前・分前・年前・万年前が同居する</text>
