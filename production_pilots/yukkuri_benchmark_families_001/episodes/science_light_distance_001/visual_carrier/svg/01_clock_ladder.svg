<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#182348"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><g fill="#b7d7ff" opacity=".55"><circle cx="180" cy="140" r="3"/><circle cx="430" cy="90" r="2"/><circle cx="760" cy="180" r="3"/><circle cx="1120" cy="110" r="2"/><circle cx="1510" cy="180" r="3"/><circle cx="1720" cy="90" r="2"/></g>
  <text x="110" y="125" fill="#f5fbff" font-size="64" font-weight="700" font-family="Meiryo, sans-serif">宇宙の距離を「光の時計」で読む</text>
  <text x="114" y="180" fill="#7ed7ff" font-size="30" font-family="Meiryo, sans-serif">同じ速さの光なら、距離は待ち時間へ言い換えられる</text>
  <path d="M170 430 H1745" stroke="#355a8c" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Meiryo, sans-serif" text-anchor="middle"><g transform="translate(220 430)"><circle r="48" fill="#d7e2ef"/><text y="-90" fill="#fff" font-size="30">月</text><text y="105" fill="#7ed7ff" font-size="34" font-weight="700">1.3秒</text></g><g transform="translate(545 430)"><circle r="58" fill="#ffcc55" filter="url(#glow)"/><text y="-100" fill="#fff" font-size="30">太陽</text><text y="110" fill="#7ed7ff" font-size="34" font-weight="700">8分20秒</text></g><g transform="translate(900 430)"><circle r="48" fill="#4b8cff"/><path d="M-82 0H82" stroke="#9fc9ff" stroke-width="6"/><text y="-90" fill="#fff" font-size="30">海王星</text><text y="105" fill="#7ed7ff" font-size="34" font-weight="700">数時間</text></g><g transform="translate(1270 430)"><path d="M0-62 16-18 62 0 16 18 0 62-16 18-62 0-16-18Z" fill="#fff0a8" filter="url(#glow)"/><text y="-90" fill="#fff" font-size="30">近い恒星</text><text y="105" fill="#7ed7ff" font-size="34" font-weight="700">約4.3年</text></g><g transform="translate(1650 430)"><ellipse rx="80" ry="36" fill="none" stroke="#c8a8ff" stroke-width="12" transform="rotate(-18)"/><circle r="20" fill="#f7eaff"/><text y="-90" fill="#fff" font-size="30">銀河</text><text y="105" fill="#7ed7ff" font-size="34" font-weight="700">約10万年</text></g></g>
  <rect x="110" y="615" width="1700" height="92" rx="24" fill="#0d2b51" stroke="#315e8c" stroke-width="2"/><text x="960" y="674" text-anchor="middle" fill="#eaf6ff" font-size="35" font-family="Meiryo, sans-serif">秒 → 分 → 時間 → 年 → 万年　桁が変わるたび、距離の意味も変わる</text>
</svg>
