<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><linearGradient id="bg" y2="1"><stop stop-color="#07172f"/><stop offset="1" stop-color="#121a34"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="110" y="125" fill="#fff" font-size="64" font-weight="700" font-family="Meiryo, sans-serif">太陽系だけで、待ち時間は「分」から「時間」へ</text><text x="114" y="182" fill="#80d8ff" font-size="30" font-family="Meiryo, sans-serif">距離が伸びると、遠隔操作は先読みした予約操作へ変わる</text>
  <g transform="translate(350 440)"><circle r="118" fill="#ffbf42" filter="url(#glow)"/><text y="190" text-anchor="middle" fill="#fff" font-size="32" font-family="Meiryo, sans-serif">太陽</text></g><g transform="translate(760 440)"><circle r="47" fill="#3988dc"/><path d="M-35-10Q0-45 30-15T30 30Q0 44-32 24Z" fill="#60b879"/><text y="120" text-anchor="middle" fill="#fff" font-size="32" font-family="Meiryo, sans-serif">地球</text></g><g transform="translate(1500 440)"><circle r="70" fill="#3f79e0"/><path d="M-115 0H115" stroke="#8ab6ff" stroke-width="7"/><text y="145" text-anchor="middle" fill="#fff" font-size="32" font-family="Meiryo, sans-serif">海王星</text></g>
  <path d="M475 390H680" stroke="#7ae0ff" stroke-width="8" stroke-dasharray="18 12"/><path d="M825 390H1415" stroke="#8a9cff" stroke-width="8" stroke-dasharray="18 12"/><g font-family="Meiryo, sans-serif" text-anchor="middle"><rect x="485" y="275" width="300" height="78" rx="18" fill="#0c2948" stroke="#7ae0ff"/><text x="635" y="326" fill="#fff" font-size="32">約8分20秒</text><rect x="980" y="275" width="370" height="78" rx="18" fill="#1b2350" stroke="#8a9cff"/><text x="1165" y="326" fill="#fff" font-size="32">位置により数時間</text></g>
  <g font-family="Meiryo, sans-serif"><rect x="190" y="650" width="1540" height="90" rx="24" fill="#10284a"/><text x="270" y="708" fill="#eaf7ff" font-size="34">月＝秒　　太陽＝分　　太陽系外縁＝時間</text><text x="1410" y="708" fill="#ffcf70" font-size="34" font-weight="700">即時操作できない</text></g>
