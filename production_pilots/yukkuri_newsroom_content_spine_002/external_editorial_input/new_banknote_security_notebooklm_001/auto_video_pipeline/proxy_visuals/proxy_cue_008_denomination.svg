<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-surface="viewer" data-cue-id="cue_008" data-scene-id="S3" data-approved-text="額面の数字は前のシリーズのお札より大きい。一万円券と千円券ではホログラムの形や位置が違い、千円券の中央には橙色のグラデーションもあるんだね。"><rect width="1920" height="1080" fill="#111111"/><rect x="56" y="48" width="1808" height="724" fill="#c9c7c0"/><rect x="110" y="98" width="1720" height="630" fill="#deddd7" stroke="#333" stroke-width="4"/><path d="M200 230H1730M200 360H1730M200 490H1730M200 620H1730" stroke="#888680" stroke-width="4"/><text x="250" y="205" fill="#222" font-family="sans-serif" font-size="42" font-weight="700">透かす</text><text x="650" y="335" fill="#222" font-family="sans-serif" font-size="42" font-weight="700">触る</text><text x="1050" y="465" fill="#222" font-family="sans-serif" font-size="42" font-weight="700">傾ける</text><text x="1370" y="595" fill="#222" font-family="sans-serif" font-size="42" font-weight="700">ルーペで見る</text><text x="142" y="92" fill="#111" font-family="sans-serif" font-size="48" font-weight="700">四つを覚える</text><rect x="0" y="820" width="1920" height="260" fill="#111111"/><rect x="56" y="854" width="190" height="74" fill="#b94a5b"/><text x="151" y="906" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="700">れいむ</text><text fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="700"><tspan x="285" y="852">額面の数字は前のシリーズのお札より大きい。一万円券と千円券では</tspan><tspan x="285" y="910">ホログラムの形や位置が違い、千円券の中央には橙色の</tspan><tspan x="285" y="968">グラデーションもあるんだね。</tspan></text></svg>
