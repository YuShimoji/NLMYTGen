<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="420" viewBox="0 0 1920 420" data-cue-coverage="9/9"><rect width="1920" height="420" fill="#151515"/><g data-cue-id="cue_001" data-scene-id="S1" data-approved-subtitle="2024年に発行された新しいお札って、見た目以外にも変わったところがあるの？"><rect x="24" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M40 64H196M40 88H196M40 112H196" stroke="#77756f" stroke-width="3"/><text x="24" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_001</text><text x="24" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S1</text><text x="24" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">問い</text></g><g data-cue-id="cue_002" data-scene-id="S1" data-approved-subtitle="あるぞ。偽造防止では、高精細すき入れや3Dホログラムなど複数の技術を組み合わせている。誰にとっても使いやすいユニバーサルデザインも取り入れたんだ。"><rect x="234" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M250 64H406M250 88H406M250 112H406" stroke="#77756f" stroke-width="3"/><text x="234" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_002</text><text x="234" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S1</text><text x="234" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">全体像</text></g><g data-cue-id="cue_003" data-scene-id="S2" data-approved-subtitle="まずは高精細すき入れ。光に透かすと、細かな模様が見えるんだぜ。"><rect x="444" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M460 64H616M460 88H616M460 112H616" stroke="#77756f" stroke-width="3"/><text x="444" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_003</text><text x="444" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S2</text><text x="444" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">透かす</text></g><g data-cue-id="cue_004" data-scene-id="S2" data-approved-subtitle="次は3Dホログラム。角度を変えると、三次元の肖像が回転して見えるぞ。"><rect x="654" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M670 64H826M670 88H826M670 112H826" stroke="#77756f" stroke-width="3"/><text x="654" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_004</text><text x="654" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S2</text><text x="654" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">傾ける</text></g><g data-cue-id="cue_005" data-scene-id="S2" data-approved-subtitle="触るとざらざらするのは、額面数字などのインキを高く盛り上げる深凹版印刷なんだね。"><rect x="864" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M880 64H1036M880 88H1036M880 112H1036" stroke="#77756f" stroke-width="3"/><text x="864" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_005</text><text x="864" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S2</text><text x="864" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">触る</text></g><g data-cue-id="cue_006" data-scene-id="S2" data-approved-subtitle="マイクロ文字の『NIPPONGINKO』は、ルーペで確かめられる。カラーコピー機では再現が難しいほど小さい文字なんだ。"><rect x="1074" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M1090 64H1246M1090 88H1246M1090 112H1246" stroke="#77756f" stroke-width="3"/><text x="1074" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_006</text><text x="1074" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S2</text><text x="1074" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">ルーペ</text></g><g data-cue-id="cue_007" data-scene-id="S3" data-approved-subtitle="見分けやすさの工夫では、識別マークを11本の斜線にそろえ、券種ごとに位置を変えているぜ。"><rect x="1284" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M1300 64H1456M1300 88H1456M1300 112H1456" stroke="#77756f" stroke-width="3"/><text x="1284" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_007</text><text x="1284" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S3</text><text x="1284" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">識別</text></g><g data-cue-id="cue_008" data-scene-id="S3" data-approved-subtitle="額面の数字は前のシリーズのお札より大きい。一万円券と千円券ではホログラムの形や位置が違い、千円券の中央には橙色のグラデーションもあるんだね。"><rect x="1494" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M1510 64H1666M1510 88H1666M1510 112H1666" stroke="#77756f" stroke-width="3"/><text x="1494" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_008</text><text x="1494" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S3</text><text x="1494" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">差を見る</text></g><g data-cue-id="cue_009" data-scene-id="S3" data-approved-subtitle="確かめ方は、透かす、触る、傾ける、ルーペで見る。この四つを覚えておこう。"><rect x="1704" y="32" width="188" height="106" fill="#c9c7c0" stroke="#eeeeea" stroke-width="2"/><path d="M1720 64H1876M1720 88H1876M1720 112H1876" stroke="#77756f" stroke-width="3"/><text x="1704" y="184" fill="#ffffff" font-family="monospace" font-size="22">cue_009</text><text x="1704" y="220" fill="#a9a9a5" font-family="sans-serif" font-size="20">S3</text><text x="1704" y="266" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700">四つ</text></g></svg>
