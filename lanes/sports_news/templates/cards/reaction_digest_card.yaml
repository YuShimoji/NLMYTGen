card_type: reaction_digest_card
purpose: "Display sourced reaction summaries as digest text."
required_fields:
  - digest_headline
  - reaction_items
item_required_fields:
  - display_label
  - source_type
  - mode
  - rendered_text
  - source_reference
visual_rules:
  render_mode: digest_text
  identity_image_dependency: none
  label_style: "FAN-01 / MEDIA-02 / ANALYST-01"
notes:
  - "The video's own explanation remains dominant; reaction cards are supporting material."
