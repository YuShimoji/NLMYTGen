card_type: reaction_digest_card
purpose: "Display sourced reaction summaries without screenshots or fake profile images."
required_fields:
  - digest_headline
  - reaction_items
item_required_fields:
  - display_label
  - source_type
  - mode
  - rendered_text
  - source_reference
visual_rules:
  no_screenshots: true
  no_profile_icons: true
  label_style: "FAN-01 / MEDIA-02 / ANALYST-01"
notes:
  - "The video's own explanation remains dominant; reaction cards are supporting material."
