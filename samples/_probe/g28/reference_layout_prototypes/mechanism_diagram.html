<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G-28 Prototype - mechanism_diagram</title>
  <style>
    html, body { margin: 0; min-width: 1920px; min-height: 1080px; background: #05070a; font-family: Arial, Helvetica, sans-serif; }
    .canvas { width: 1920px; height: 1080px; background: #0c1016; }
  </style>
</head>
<body>
<main class="canvas" aria-label="mechanism diagram reference layout prototype">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
    <title id="title">mechanism_diagram prototype</title>
    <desc id="desc">Two schematic comparison panels with arrows, OK and NG states, central explanation, grid, margins, and subtitle reserve.</desc>

    <rect x="0" y="0" width="1920" height="1080" fill="#0c1016"/>
    <g stroke="#273543" stroke-width="1" opacity="0.45">
      <line x1="160" y1="0" x2="160" y2="1080"/>
      <line x1="480" y1="0" x2="480" y2="1080"/>
      <line x1="960" y1="0" x2="960" y2="1080"/>
      <line x1="1440" y1="0" x2="1440" y2="1080"/>
      <line x1="1760" y1="0" x2="1760" y2="1080"/>
      <line x1="0" y1="90" x2="1920" y2="90"/>
      <line x1="0" y1="540" x2="1920" y2="540"/>
      <line x1="0" y1="920" x2="1920" y2="920"/>
    </g>
    <rect x="160" y="90" width="1600" height="830" fill="none" stroke="#43576b" stroke-width="2" stroke-dasharray="18 14"/>
    <line x1="960" y1="90" x2="960" y2="920" stroke="#6ad4ff" stroke-width="2" stroke-dasharray="12 16"/>

    <text x="160" y="76" fill="#eaf2fb" font-size="34" font-weight="700">mechanism_diagram</text>
    <text x="160" y="124" fill="#9fb1c0" font-size="20">Two schematic panels compare a stable path with a broken path; center note anchors the explanation.</text>

    <g transform="translate(190 185)">
      <rect x="0" y="0" width="650" height="540" rx="8" fill="#111922" stroke="#3b4b5d" stroke-width="2"/>
      <rect x="28" y="28" width="140" height="46" rx="6" fill="#173423" stroke="#8ee0a1"/>
      <text x="54" y="59" fill="#8ee0a1" font-size="24" font-weight="700">OK</text>
      <text x="210" y="60" fill="#e8eef4" font-size="24" font-weight="700">Stable mechanism</text>
      <g transform="translate(78 142)">
        <rect x="0" y="0" width="150" height="92" rx="8" fill="#1d2a35" stroke="#6ad4ff" stroke-width="3"/>
        <text x="36" y="56" fill="#e8eef4" font-size="22" font-weight="700">Input</text>
        <line x1="170" y1="46" x2="296" y2="46" stroke="#f8c567" stroke-width="5"/>
        <polygon points="296,46 274,32 274,60" fill="#f8c567"/>
        <rect x="316" y="0" width="150" height="92" rx="8" fill="#25303b" stroke="#f8c567" stroke-width="3"/>
        <text x="354" y="56" fill="#e8eef4" font-size="22" font-weight="700">Rule</text>
        <line x1="486" y1="46" x2="586" y2="46" stroke="#f8c567" stroke-width="5"/>
        <polygon points="586,46 564,32 564,60" fill="#f8c567"/>
      </g>
      <g transform="translate(170 318)">
        <circle cx="90" cy="72" r="64" fill="#182b22" stroke="#8ee0a1" stroke-width="4"/>
        <text x="48" y="82" fill="#8ee0a1" font-size="28" font-weight="700">Clear</text>
        <rect x="250" y="20" width="180" height="104" rx="8" fill="#1d2a35" stroke="#6ad4ff" stroke-width="3"/>
        <text x="290" y="62" fill="#e8eef4" font-size="21" font-weight="700">Outcome</text>
        <text x="286" y="95" fill="#aab7c4" font-size="18">reviewable</text>
      </g>
    </g>

    <g transform="translate(1080 185)">
      <rect x="0" y="0" width="650" height="540" rx="8" fill="#111922" stroke="#3b4b5d" stroke-width="2"/>
      <rect x="28" y="28" width="140" height="46" rx="6" fill="#3a2020" stroke="#ff7b7b"/>
      <text x="54" y="59" fill="#ff7b7b" font-size="24" font-weight="700">NG</text>
      <text x="210" y="60" fill="#e8eef4" font-size="24" font-weight="700">Broken mechanism</text>
      <g transform="translate(78 142)">
        <rect x="0" y="0" width="150" height="92" rx="8" fill="#1d2a35" stroke="#6ad4ff" stroke-width="3"/>
        <text x="36" y="56" fill="#e8eef4" font-size="22" font-weight="700">Input</text>
        <line x1="170" y1="46" x2="296" y2="46" stroke="#ff7b7b" stroke-width="5" stroke-dasharray="14 12"/>
        <polygon points="296,46 274,32 274,60" fill="#ff7b7b"/>
        <rect x="316" y="0" width="150" height="92" rx="8" fill="#2b1d24" stroke="#ff7b7b" stroke-width="3"/>
        <text x="344" y="56" fill="#e8eef4" font-size="22" font-weight="700">Guess</text>
        <line x1="486" y1="46" x2="586" y2="46" stroke="#ff7b7b" stroke-width="5" stroke-dasharray="14 12"/>
        <polygon points="586,46 564,32 564,60" fill="#ff7b7b"/>
      </g>
      <g transform="translate(170 318)">
        <circle cx="90" cy="72" r="64" fill="#351f22" stroke="#ff7b7b" stroke-width="4"/>
        <text x="42" y="82" fill="#ff7b7b" font-size="28" font-weight="700">Noise</text>
        <rect x="250" y="20" width="180" height="104" rx="8" fill="#1d2a35" stroke="#6ad4ff" stroke-width="3"/>
        <text x="298" y="62" fill="#e8eef4" font-size="21" font-weight="700">Result</text>
        <text x="288" y="95" fill="#aab7c4" font-size="18">unclear</text>
      </g>
    </g>

    <g transform="translate(720 725)">
      <rect x="0" y="0" width="480" height="125" rx="8" fill="#162330" stroke="#f8c567" stroke-width="2"/>
      <text x="28" y="42" fill="#f8c567" font-size="22" font-weight="700">CENTRAL EXPLANATION</text>
      <text x="28" y="76" fill="#e8eef4" font-size="20">The viewer should understand why the</text>
      <text x="28" y="104" fill="#e8eef4" font-size="20">same input becomes OK or NG.</text>
    </g>

    <g transform="translate(1420 735)">
      <rect x="0" y="0" width="300" height="145" rx="8" fill="#131c26" stroke="#344454"/>
      <text x="24" y="34" fill="#6ad4ff" font-size="18" font-weight="700">ON-PAGE NOTE</text>
      <text x="24" y="64" fill="#e8eef4" font-size="15">Abstracts: OK/NG mechanism comparison.</text>
      <text x="24" y="91" fill="#aab7c4" font-size="15">Does not copy source diagrams or brands.</text>
      <text x="24" y="118" fill="#f8c567" font-size="15">Review arrows, balance, and text budget.</text>
    </g>

    <rect x="0" y="920" width="1920" height="120" fill="#090d12" stroke="#344454" stroke-width="2"/>
    <text x="160" y="970" fill="#6ad4ff" font-size="20" font-weight="700">SUBTITLE RESERVE</text>
    <text x="160" y="1006" fill="#aab7c4" font-size="18">Comparison panels and central note remain above the caption band.</text>
  </svg>
</main>
</body>
</html>
