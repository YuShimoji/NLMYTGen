<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G-28 Prototype - lecture_list</title>
  <style>
    html, body { margin: 0; min-width: 1920px; min-height: 1080px; background: #05070a; font-family: Arial, Helvetica, sans-serif; }
    .canvas { width: 1920px; height: 1080px; background: #0b0f14; }
  </style>
</head>
<body>
<main class="canvas" aria-label="lecture list reference layout prototype">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
    <title id="title">lecture_list prototype</title>
    <desc id="desc">Dark explainer list layout with icon column, numbered rows, dot leaders, host placeholders, grid, margins, and subtitle reserve.</desc>

    <rect x="0" y="0" width="1920" height="1080" fill="#0b0f14"/>
    <g stroke="#273543" stroke-width="1" opacity="0.45">
      <line x1="160" y1="0" x2="160" y2="1080"/>
      <line x1="480" y1="0" x2="480" y2="1080"/>
      <line x1="960" y1="0" x2="960" y2="1080"/>
      <line x1="1440" y1="0" x2="1440" y2="1080"/>
      <line x1="1760" y1="0" x2="1760" y2="1080"/>
      <line x1="0" y1="90" x2="1920" y2="90"/>
      <line x1="0" y1="540" x2="1920" y2="540"/>
      <line x1="0" y1="920" x2="1920" y2="920"/>
    </g>
    <rect x="160" y="90" width="1600" height="830" fill="none" stroke="#43576b" stroke-width="2" stroke-dasharray="18 14"/>
    <line x1="960" y1="90" x2="960" y2="920" stroke="#6ad4ff" stroke-width="2" stroke-dasharray="12 16"/>

    <text x="160" y="76" fill="#eaf2fb" font-size="34" font-weight="700">lecture_list</text>
    <text x="160" y="124" fill="#9fb1c0" font-size="20">Dark list grammar: icons, short terms, numeric hierarchy, dot-leader rhythm, and visible subtitle reserve.</text>

    <g transform="translate(265 176)">
      <rect x="0" y="0" width="1110" height="620" rx="8" fill="#111821" stroke="#3b4b5d" stroke-width="2"/>
      <rect x="34" y="34" width="1042" height="84" rx="8" fill="#1b2530" stroke="#344454"/>
      <text x="64" y="88" fill="#f8c567" font-size="30" font-weight="700">TOPIC STACK / five short beats</text>

      <g transform="translate(52 158)" font-size="28">
        <g>
          <circle cx="28" cy="28" r="22" fill="#213141" stroke="#6ad4ff" stroke-width="3"/>
          <text x="21" y="38" fill="#6ad4ff" font-size="26" font-weight="700">1</text>
          <text x="86" y="37" fill="#e8eef4" font-weight="700">ENTRY COST</text>
          <line x1="320" y1="28" x2="740" y2="28" stroke="#536474" stroke-width="4" stroke-dasharray="4 18"/>
          <text x="780" y="37" fill="#8ee0a1" font-weight="700">LOW</text>
        </g>
        <g transform="translate(0 84)">
          <circle cx="28" cy="28" r="22" fill="#213141" stroke="#6ad4ff" stroke-width="3"/>
          <text x="21" y="38" fill="#6ad4ff" font-size="26" font-weight="700">2</text>
          <text x="86" y="37" fill="#e8eef4" font-weight="700">TIME LAG</text>
          <line x1="320" y1="28" x2="740" y2="28" stroke="#536474" stroke-width="4" stroke-dasharray="4 18"/>
          <text x="780" y="37" fill="#f8c567" font-weight="700">MID</text>
        </g>
        <g transform="translate(0 168)">
          <circle cx="28" cy="28" r="22" fill="#213141" stroke="#6ad4ff" stroke-width="3"/>
          <text x="21" y="38" fill="#6ad4ff" font-size="26" font-weight="700">3</text>
          <text x="86" y="37" fill="#e8eef4" font-weight="700">HIDDEN RULE</text>
          <line x1="320" y1="28" x2="740" y2="28" stroke="#536474" stroke-width="4" stroke-dasharray="4 18"/>
          <text x="780" y="37" fill="#ff7b7b" font-weight="700">HIGH</text>
        </g>
        <g transform="translate(0 252)">
          <circle cx="28" cy="28" r="22" fill="#213141" stroke="#6ad4ff" stroke-width="3"/>
          <text x="21" y="38" fill="#6ad4ff" font-size="26" font-weight="700">4</text>
          <text x="86" y="37" fill="#e8eef4" font-weight="700">USER CHOICE</text>
          <line x1="320" y1="28" x2="740" y2="28" stroke="#536474" stroke-width="4" stroke-dasharray="4 18"/>
          <text x="780" y="37" fill="#f8c567" font-weight="700">MID</text>
        </g>
        <g transform="translate(0 336)">
          <circle cx="28" cy="28" r="22" fill="#213141" stroke="#6ad4ff" stroke-width="3"/>
          <text x="21" y="38" fill="#6ad4ff" font-size="26" font-weight="700">5</text>
          <text x="86" y="37" fill="#e8eef4" font-weight="700">FINAL CLAIM</text>
          <line x1="320" y1="28" x2="740" y2="28" stroke="#536474" stroke-width="4" stroke-dasharray="4 18"/>
          <text x="780" y="37" fill="#8ee0a1" font-weight="700">CLEAR</text>
        </g>
      </g>
    </g>

    <g transform="translate(1420 190)">
      <rect x="0" y="0" width="300" height="326" rx="8" fill="#131c26" stroke="#344454"/>
      <text x="24" y="42" fill="#6ad4ff" font-size="20" font-weight="700">ON-PAGE NOTE</text>
      <text x="24" y="84" fill="#e8eef4" font-size="17">Abstracts: dark</text>
      <text x="24" y="110" fill="#e8eef4" font-size="17">explainer list grammar,</text>
      <text x="24" y="136" fill="#e8eef4" font-size="17">icon rhythm, short terms,</text>
      <text x="24" y="162" fill="#e8eef4" font-size="17">and dot leaders.</text>
      <text x="24" y="204" fill="#aab7c4" font-size="17">Does not copy images,</text>
      <text x="24" y="230" fill="#aab7c4" font-size="17">logos, characters, maps,</text>
      <text x="24" y="256" fill="#aab7c4" font-size="17">company material, footage.</text>
      <text x="24" y="298" fill="#f8c567" font-size="17">Review density and reserve.</text>
    </g>

    <g transform="translate(175 732)" opacity="0.9">
      <circle cx="68" cy="72" r="56" fill="#18212b" stroke="#52677a" stroke-width="4"/>
      <rect x="38" y="134" width="60" height="70" rx="22" fill="#18212b" stroke="#52677a" stroke-width="4"/>
      <text x="0" y="232" fill="#8a9aaa" font-size="17">host placeholder</text>
    </g>
    <g transform="translate(1680 740)" opacity="0.75">
      <circle cx="48" cy="64" r="48" fill="#18212b" stroke="#52677a" stroke-width="4"/>
      <rect x="22" y="116" width="52" height="62" rx="20" fill="#18212b" stroke="#52677a" stroke-width="4"/>
    </g>

    <rect x="0" y="920" width="1920" height="120" fill="#090d12" stroke="#344454" stroke-width="2"/>
    <text x="160" y="970" fill="#6ad4ff" font-size="20" font-weight="700">SUBTITLE RESERVE</text>
    <text x="160" y="1006" fill="#aab7c4" font-size="18">Visible lower band remains clear; host placeholders stay above and non-focal.</text>
  </svg>
</main>
</body>
</html>
