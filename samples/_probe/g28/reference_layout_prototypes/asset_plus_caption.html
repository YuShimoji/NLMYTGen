<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G-28 Prototype - asset_plus_caption</title>
  <style>
    :root { --background:#101318; --panel:#18212b; --panel2:#202b36; --text:#edf3f8; --muted:#a8b5c0; --accent:#4fb7d8; --warning:#e4b356; --grid:#344454; --subtitle:#080b0f; }
    html, body { margin:0; min-width:1920px; min-height:1080px; background:#05070a; font-family:Arial, Helvetica, sans-serif; }
    .canvas { width:1920px; height:1080px; background:var(--background); }
  </style>
</head>
<body>
<main class="canvas" aria-label="asset plus caption content-first prototype">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
    <title id="title">asset_plus_caption prototype</title>
    <desc id="desc">One dominant asset placeholder with strong lower telop, optional side note, grid, margins, and subtitle reserve.</desc>
    <rect width="1920" height="1080" fill="var(--background)"/>
    <g stroke="var(--grid)" stroke-width="1" opacity="0.42">
      <line x1="160" y1="0" x2="160" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/><line x1="1760" y1="0" x2="1760" y2="1080"/>
      <line x1="0" y1="90" x2="1920" y2="90"/><line x1="0" y1="540" x2="1920" y2="540"/><line x1="0" y1="920" x2="1920" y2="920"/>
    </g>
    <rect x="160" y="90" width="1600" height="830" fill="none" stroke="#536474" stroke-width="2" stroke-dasharray="18 14"/>
    <line x1="960" y1="90" x2="960" y2="920" stroke="var(--accent)" stroke-width="2" stroke-dasharray="12 16"/>
    <text x="160" y="76" fill="var(--text)" font-size="34" font-weight="700">asset_plus_caption</text>
    <text x="160" y="124" fill="var(--muted)" font-size="20">YouTube-simple layout: one dominant content asset, strong lower telop, optional side note. No real asset.</text>
    <a href="index.html"><text x="1588" y="76" fill="var(--accent)" font-size="20" font-weight="700">Back to index</text></a>

    <g transform="translate(250 165)">
      <rect x="0" y="0" width="1420" height="665" rx="8" fill="var(--panel)" stroke="#43576b" stroke-width="2"/>
      <rect x="70" y="58" width="920" height="452" rx="8" fill="#14212a" stroke="var(--accent)" stroke-width="4"/>
      <circle cx="530" cy="284" r="120" fill="#1f3440" stroke="#536474" stroke-width="4"/>
      <rect x="212" y="386" width="636" height="48" rx="6" fill="#22303b"/>
      <text x="350" y="292" fill="var(--text)" font-size="34" font-weight="700">ASSET SLOT</text>
      <text x="312" y="334" fill="var(--muted)" font-size="22">dominant placeholder only</text>
      <rect x="70" y="540" width="920" height="84" rx="8" fill="#231f14" stroke="var(--warning)" stroke-width="2"/>
      <text x="102" y="592" fill="var(--warning)" font-size="26" font-weight="700">LOWER TELOP</text>
      <text x="300" y="592" fill="var(--text)" font-size="26">strong short claim above subtitles</text>
      <rect x="1040" y="58" width="310" height="190" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="1066" y="101" fill="var(--accent)" font-size="22" font-weight="700">side_note</text>
      <text x="1066" y="139" fill="var(--text)" font-size="20">Optional context</text>
      <text x="1066" y="172" fill="var(--muted)" font-size="17">Keep secondary.</text>
      <rect x="1040" y="286" width="310" height="150" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="1066" y="329" fill="var(--warning)" font-size="22" font-weight="700">source_note</text>
      <text x="1066" y="367" fill="var(--text)" font-size="19">Bounded provenance</text>
    </g>

    <g transform="translate(250 850)">
      <rect x="0" y="0" width="1420" height="52" rx="8" fill="var(--panel2)" stroke="var(--grid)"/>
      <text x="18" y="33" fill="var(--accent)" font-size="16" font-weight="700">NOTE</text>
      <text x="82" y="33" fill="var(--text)" font-size="16">Layout uses image_slot, lower_third_telop, optional source_note, optional side note, and caption_reserve.</text>
    </g>
    <rect x="0" y="920" width="1920" height="120" fill="var(--subtitle)" stroke="var(--grid)" stroke-width="2"/>
    <text x="160" y="970" fill="var(--accent)" font-size="20" font-weight="700">SUBTITLE RESERVE</text>
    <text x="160" y="1006" fill="var(--muted)" font-size="18">Simple YouTube layout keeps the telop separated from the subtitle band.</text>
  </svg>
</main>
</body>
</html>
