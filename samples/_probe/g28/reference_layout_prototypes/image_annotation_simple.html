<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G-28 Prototype - image_annotation_simple</title>
  <style>
    :root { --background:#101318; --panel:#18212b; --panel2:#202b36; --text:#edf3f8; --muted:#a8b5c0; --accent:#4fb7d8; --warning:#e4b356; --grid:#344454; --subtitle:#080b0f; }
    html, body { margin:0; min-width:1920px; min-height:1080px; background:#05070a; font-family:Arial, Helvetica, sans-serif; }
    .canvas { width:1920px; height:1080px; background:var(--background); }
  </style>
</head>
<body>
<main class="canvas" aria-label="image annotation simple content-first prototype">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
    <title id="title">image_annotation_simple prototype</title>
    <desc id="desc">Large image placeholder with labels, arrows, highlight boxes, margins, center, and subtitle reserve.</desc>
    <rect width="1920" height="1080" fill="var(--background)"/>
    <g stroke="var(--grid)" stroke-width="1" opacity="0.42">
      <line x1="160" y1="0" x2="160" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/><line x1="1760" y1="0" x2="1760" y2="1080"/>
      <line x1="0" y1="90" x2="1920" y2="90"/><line x1="0" y1="540" x2="1920" y2="540"/><line x1="0" y1="920" x2="1920" y2="920"/>
    </g>
    <rect x="160" y="90" width="1600" height="830" fill="none" stroke="#536474" stroke-width="2" stroke-dasharray="18 14"/>
    <line x1="960" y1="90" x2="960" y2="920" stroke="var(--accent)" stroke-width="2" stroke-dasharray="12 16"/>
    <text x="160" y="76" fill="var(--text)" font-size="34" font-weight="700">image_annotation_simple</text>
    <text x="160" y="124" fill="var(--muted)" font-size="20">One dominant image placeholder plus two or three annotations. No real image path or external asset.</text>
    <a href="index.html"><text x="1588" y="76" fill="var(--accent)" font-size="20" font-weight="700">Back to index</text></a>

    <g transform="translate(210 170)">
      <rect x="0" y="0" width="1060" height="660" rx="8" fill="var(--panel)" stroke="#43576b" stroke-width="2"/>
      <rect x="54" y="48" width="952" height="520" rx="8" fill="#14212a" stroke="var(--accent)" stroke-width="4"/>
      <path d="M102 484 L268 342 L404 420 L560 270 L748 370 L940 220" fill="none" stroke="#2f4c58" stroke-width="44" opacity="0.75"/>
      <circle cx="365" cy="260" r="70" fill="none" stroke="var(--warning)" stroke-width="8"/>
      <rect x="650" y="330" width="220" height="110" rx="6" fill="none" stroke="var(--warning)" stroke-width="6"/>
      <text x="318" y="620" fill="var(--muted)" font-size="22">IMAGE SLOT PLACEHOLDER - abstract geometry only</text>
    </g>

    <g transform="translate(1320 190)">
      <rect x="0" y="0" width="400" height="132" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="24" y="39" fill="var(--warning)" font-size="22" font-weight="700">label_chip A</text>
      <text x="24" y="72" fill="var(--text)" font-size="20">Mark the first visual clue.</text>
      <path d="M0 105 C-120 145 -260 145 -555 238" fill="none" stroke="var(--warning)" stroke-width="4"/>
      <polygon points="-560,240 -536,228 -542,254" fill="var(--warning)"/>
    </g>
    <g transform="translate(1320 398)">
      <rect x="0" y="0" width="400" height="132" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="24" y="39" fill="var(--accent)" font-size="22" font-weight="700">callout_box B</text>
      <text x="24" y="72" fill="var(--text)" font-size="20">Explain the highlighted area.</text>
      <path d="M0 95 C-120 112 -235 110 -450 15" fill="none" stroke="var(--accent)" stroke-width="4"/>
      <polygon points="-455,12 -430,12 -446,34" fill="var(--accent)"/>
    </g>
    <g transform="translate(1320 606)">
      <rect x="0" y="0" width="400" height="132" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="24" y="39" fill="var(--warning)" font-size="22" font-weight="700">label_chip C</text>
      <text x="24" y="72" fill="var(--text)" font-size="20">Optional third annotation.</text>
      <path d="M0 38 C-110 0 -230 -16 -450 -210" fill="none" stroke="var(--warning)" stroke-width="4"/>
      <polygon points="-455,-214 -430,-205 -451,-190" fill="var(--warning)"/>
    </g>

    <g transform="translate(210 850)">
      <rect x="0" y="0" width="1510" height="52" rx="8" fill="var(--panel2)" stroke="var(--grid)"/>
      <text x="18" y="33" fill="var(--accent)" font-size="16" font-weight="700">NOTE</text>
      <text x="82" y="33" fill="var(--text)" font-size="16">Layout uses image_slot, highlight_box, arrow, label_chip, callout_box, source_note optional, and caption_reserve.</text>
    </g>
    <rect x="0" y="920" width="1920" height="120" fill="var(--subtitle)" stroke="var(--grid)" stroke-width="2"/>
    <text x="160" y="970" fill="var(--accent)" font-size="20" font-weight="700">SUBTITLE RESERVE</text>
    <text x="160" y="1006" fill="var(--muted)" font-size="18">Lower caption band stays empty; annotations and image placeholder stop above it.</text>
  </svg>
</main>
</body>
</html>
