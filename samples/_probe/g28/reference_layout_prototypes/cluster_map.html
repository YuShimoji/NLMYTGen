<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G-28 Prototype - cluster_map</title>
  <style>
    html, body { margin: 0; min-width: 1920px; min-height: 1080px; background: #05070a; font-family: Arial, Helvetica, sans-serif; }
    .canvas { width: 1920px; height: 1080px; background: #081016; }
  </style>
</head>
<body>
<main class="canvas" aria-label="cluster map reference layout prototype">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
    <title id="title">cluster_map prototype</title>
    <desc id="desc">Abstract satellite-like field with points, leader lines, label clusters, grid, margins, and subtitle reserve.</desc>

    <rect x="0" y="0" width="1920" height="1080" fill="#081016"/>
    <g stroke="#273543" stroke-width="1" opacity="0.45">
      <line x1="160" y1="0" x2="160" y2="1080"/>
      <line x1="480" y1="0" x2="480" y2="1080"/>
      <line x1="960" y1="0" x2="960" y2="1080"/>
      <line x1="1440" y1="0" x2="1440" y2="1080"/>
      <line x1="1760" y1="0" x2="1760" y2="1080"/>
      <line x1="0" y1="90" x2="1920" y2="90"/>
      <line x1="0" y1="540" x2="1920" y2="540"/>
      <line x1="0" y1="920" x2="1920" y2="920"/>
    </g>
    <rect x="160" y="90" width="1600" height="830" fill="none" stroke="#43576b" stroke-width="2" stroke-dasharray="18 14"/>
    <line x1="960" y1="90" x2="960" y2="920" stroke="#6ad4ff" stroke-width="2" stroke-dasharray="12 16"/>

    <text x="160" y="76" fill="#eaf2fb" font-size="34" font-weight="700">cluster_map</text>
    <text x="160" y="124" fill="#9fb1c0" font-size="20">Abstract satellite/map-like surface: points, leaders, label clusters. No real map or satellite image.</text>

    <g transform="translate(190 160)">
      <rect x="0" y="0" width="1540" height="700" rx="8" fill="#101820" stroke="#3b4b5d" stroke-width="2"/>
      <g opacity="0.88">
        <ellipse cx="420" cy="260" rx="310" ry="140" fill="#14252b" stroke="#284253" stroke-width="2"/>
        <ellipse cx="850" cy="385" rx="420" ry="190" fill="#112229" stroke="#284253" stroke-width="2"/>
        <ellipse cx="1130" cy="210" rx="240" ry="110" fill="#172a2f" stroke="#284253" stroke-width="2"/>
        <path d="M140 510 C300 430 510 520 660 448 C800 378 950 460 1110 398 C1250 344 1350 420 1440 360" fill="none" stroke="#24414c" stroke-width="38" opacity="0.55"/>
        <path d="M120 195 C330 120 520 205 710 145 C890 90 1060 155 1310 112" fill="none" stroke="#213a45" stroke-width="34" opacity="0.55"/>
      </g>
      <g stroke="#536474" stroke-width="1" opacity="0.45">
        <line x1="80" y1="80" x2="1460" y2="80"/>
        <line x1="80" y1="200" x2="1460" y2="200"/>
        <line x1="80" y1="320" x2="1460" y2="320"/>
        <line x1="80" y1="440" x2="1460" y2="440"/>
        <line x1="80" y1="560" x2="1460" y2="560"/>
        <line x1="260" y1="60" x2="260" y2="620"/>
        <line x1="540" y1="60" x2="540" y2="620"/>
        <line x1="820" y1="60" x2="820" y2="620"/>
        <line x1="1100" y1="60" x2="1100" y2="620"/>
        <line x1="1380" y1="60" x2="1380" y2="620"/>
      </g>

      <g fill="#f8c567" stroke="#0b0f14" stroke-width="3">
        <circle cx="410" cy="262" r="9"/>
        <circle cx="456" cy="296" r="9"/>
        <circle cx="514" cy="244" r="9"/>
        <circle cx="770" cy="392" r="9"/>
        <circle cx="842" cy="426" r="9"/>
        <circle cx="900" cy="370" r="9"/>
        <circle cx="1106" cy="222" r="9"/>
        <circle cx="1170" cy="254" r="9"/>
        <circle cx="1218" cy="202" r="9"/>
      </g>

      <g stroke="#8ee0a1" stroke-width="2">
        <line x1="514" y1="244" x2="616" y2="168"/>
        <line x1="842" y1="426" x2="998" y2="520"/>
        <line x1="1170" y1="254" x2="1292" y2="170"/>
      </g>
      <g font-size="19" font-weight="700">
        <rect x="616" y="128" width="230" height="72" rx="6" fill="#111821" stroke="#8ee0a1"/>
        <text x="638" y="158" fill="#e8eef4">Cluster alpha</text>
        <text x="638" y="184" fill="#aab7c4" font-size="16">3 linked points</text>
        <rect x="998" y="486" width="240" height="72" rx="6" fill="#111821" stroke="#8ee0a1"/>
        <text x="1020" y="516" fill="#e8eef4">Cluster beta</text>
        <text x="1020" y="542" fill="#aab7c4" font-size="16">dense local group</text>
        <rect x="1292" y="130" width="220" height="72" rx="6" fill="#111821" stroke="#8ee0a1"/>
        <text x="1314" y="160" fill="#e8eef4">Cluster gamma</text>
        <text x="1314" y="186" fill="#aab7c4" font-size="16">edge signal</text>
      </g>

      <g transform="translate(40 596)">
        <rect x="0" y="0" width="1460" height="74" rx="8" fill="#17202a" stroke="#344454"/>
        <text x="24" y="31" fill="#6ad4ff" font-size="16" font-weight="700">ON-PAGE NOTE</text>
        <text x="170" y="31" fill="#e8eef4" font-size="16">Abstracts: cluster-map grammar, field texture, point groups, leaders, label clusters.</text>
        <text x="170" y="58" fill="#aab7c4" font-size="16">Does not copy: map, satellite imagery, location data, logos, characters, source footage, or real place shapes. Review point density and label collisions.</text>
      </g>
    </g>

    <rect x="0" y="920" width="1920" height="120" fill="#090d12" stroke="#344454" stroke-width="2"/>
    <text x="160" y="970" fill="#6ad4ff" font-size="20" font-weight="700">SUBTITLE RESERVE</text>
    <text x="160" y="1006" fill="#aab7c4" font-size="18">Map-like field stops above the lower reserve; labels are kept inside main safe area.</text>
  </svg>
</main>
</body>
</html>
