<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>G-28 Prototype - article_quote_card</title>
  <style>
    :root { --background:#101318; --panel:#18212b; --panel2:#202b36; --text:#edf3f8; --muted:#a8b5c0; --accent:#4fb7d8; --warning:#e4b356; --grid:#344454; --subtitle:#080b0f; }
    html, body { margin:0; min-width:1920px; min-height:1080px; background:#05070a; font-family:Arial, Helvetica, sans-serif; }
    .canvas { width:1920px; height:1080px; background:var(--background); }
  </style>
</head>
<body>
<main class="canvas" aria-label="article quote card content-first prototype">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
    <title id="title">article_quote_card prototype</title>
    <desc id="desc">Article or document placeholder with quote highlight, source note, interpretation chip, and subtitle reserve.</desc>
    <rect width="1920" height="1080" fill="var(--background)"/>
    <g stroke="var(--grid)" stroke-width="1" opacity="0.42">
      <line x1="160" y1="0" x2="160" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/><line x1="1760" y1="0" x2="1760" y2="1080"/>
      <line x1="0" y1="90" x2="1920" y2="90"/><line x1="0" y1="540" x2="1920" y2="540"/><line x1="0" y1="920" x2="1920" y2="920"/>
    </g>
    <rect x="160" y="90" width="1600" height="830" fill="none" stroke="#536474" stroke-width="2" stroke-dasharray="18 14"/>
    <line x1="960" y1="90" x2="960" y2="920" stroke="var(--accent)" stroke-width="2" stroke-dasharray="12 16"/>
    <text x="160" y="76" fill="var(--text)" font-size="34" font-weight="700">article_quote_card</text>
    <text x="160" y="124" fill="var(--muted)" font-size="20">Document card placeholder with short quote highlight and bounded source note. No copied article body.</text>
    <a href="index.html"><text x="1588" y="76" fill="var(--accent)" font-size="20" font-weight="700">Back to index</text></a>

    <g transform="translate(220 170)">
      <rect x="0" y="0" width="980" height="660" rx="8" fill="var(--panel)" stroke="#43576b" stroke-width="2"/>
      <rect x="62" y="54" width="856" height="512" rx="8" fill="#f3f0e6" stroke="#c9c1aa" stroke-width="2"/>
      <rect x="100" y="92" width="380" height="22" rx="4" fill="#263746" opacity="0.75"/>
      <rect x="100" y="142" width="720" height="14" rx="4" fill="#9aa1a8" opacity="0.8"/>
      <rect x="100" y="176" width="680" height="14" rx="4" fill="#9aa1a8" opacity="0.7"/>
      <rect x="100" y="210" width="720" height="14" rx="4" fill="#9aa1a8" opacity="0.7"/>
      <rect x="100" y="278" width="720" height="106" rx="8" fill="#fff4c2" stroke="var(--warning)" stroke-width="4"/>
      <text x="132" y="326" fill="#27313a" font-size="28" font-weight="700">"Short quoted claim goes here"</text>
      <text x="132" y="360" fill="#52606c" font-size="20">excerpt placeholder under quote limit</text>
      <rect x="100" y="430" width="720" height="14" rx="4" fill="#9aa1a8" opacity="0.7"/>
      <rect x="100" y="464" width="620" height="14" rx="4" fill="#9aa1a8" opacity="0.7"/>
      <text x="250" y="620" fill="var(--muted)" font-size="21">ARTICLE / DOCUMENT CARD PLACEHOLDER</text>
    </g>

    <g transform="translate(1270 200)">
      <rect x="0" y="0" width="450" height="150" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="24" y="41" fill="var(--warning)" font-size="22" font-weight="700">quote_card</text>
      <text x="24" y="78" fill="var(--text)" font-size="21">Use a short excerpt only.</text>
      <text x="24" y="112" fill="var(--muted)" font-size="18">No full article reproduction.</text>
      <line x1="0" y1="116" x2="-350" y2="228" stroke="var(--warning)" stroke-width="4"/>
    </g>
    <g transform="translate(1270 420)">
      <rect x="0" y="0" width="450" height="130" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="24" y="41" fill="var(--accent)" font-size="22" font-weight="700">interpretation label</text>
      <text x="24" y="78" fill="var(--text)" font-size="21">One narrated takeaway.</text>
    </g>
    <g transform="translate(1270 620)">
      <rect x="0" y="0" width="450" height="120" rx="8" fill="var(--panel2)" stroke="#43576b"/>
      <text x="24" y="41" fill="var(--warning)" font-size="22" font-weight="700">source_note</text>
      <text x="24" y="78" fill="var(--text)" font-size="19">Source label, date, scope only.</text>
    </g>

    <g transform="translate(220 850)">
      <rect x="0" y="0" width="1500" height="52" rx="8" fill="var(--panel2)" stroke="var(--grid)"/>
      <text x="18" y="33" fill="var(--accent)" font-size="16" font-weight="700">NOTE</text>
      <text x="82" y="33" fill="var(--text)" font-size="16">Layout uses quote_card, source_note, label_chip, optional callout_box, and caption_reserve.</text>
    </g>
    <rect x="0" y="920" width="1920" height="120" fill="var(--subtitle)" stroke="var(--grid)" stroke-width="2"/>
    <text x="160" y="970" fill="var(--accent)" font-size="20" font-weight="700">SUBTITLE RESERVE</text>
    <text x="160" y="1006" fill="var(--muted)" font-size="18">Quote and interpretation stop above subtitle reserve; no raw article body is embedded.</text>
  </svg>
</main>
</body>
</html>
