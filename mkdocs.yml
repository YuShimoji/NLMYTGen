site_name: NLMYTGen Local Doc View
site_description: Local-only Markdown browser for audit and browser translation checks.
docs_dir: _local/mkdocs-src
site_dir: _local/mkdocs-site
use_directory_urls: true

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - toc.follow

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

hooks:
  - tools/mkdocs_local_filter.py

validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: ignore
    absolute_links: relative_to_docs
    unrecognized_links: ignore
    anchors: ignore

exclude_docs: |
  .agent/**
  .claude/**
  .codex/**
  .git/**
  .pytest_cache/**
  .venv/**
  __pycache__/**
  _local/**
  _tmp/**
  build/**
  dist/**
  node_modules/**
  venv/**
  **/node_modules/**
  **/__pycache__/**
  nlmytgen.egg-info/**

