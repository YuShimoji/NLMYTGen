site_name: NLMYTGen Local Docs
site_description: Local browser view for repository Markdown audit and temporary page translation.
docs_dir: .mkdocs-docs
site_dir: .mkdocs-site
use_directory_urls: true
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
exclude_docs: |
  .git/
  .mkdocs-docs/
  .mkdocs-site/
  .mypy_cache/
  .pytest_cache/
  .venv/
  __pycache__/
  build/
  dist/
  gui/node_modules/
  node_modules/
  site/
  venv/
  _tmp/
  **/__pycache__/
  **/*.pyc
  **/*.pyo
  **/*.ymmp
  **/*.csv
  **/*.opml
  **/*.opml.xml

